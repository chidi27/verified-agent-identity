name: chidi27

on:
  workflow_dispatch:
    inputs:
      agent_name:
        description: 'Name of the agent'
        required: true
        default: 'finder'
      agent_description:
        description: 'Description of the agent'
        required: true
        default: 'finder AI Agent'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm' # Optional: Speeds up future runs

      - name: Step 1 - Install ClawHub skill
        run: npx clawhub@latest install verified-agent-identity

      - name: Install script dependencies^
        run: |
          cd scripts
          npm install

      - name: Step 2 - Create new Ethereum Identity
        run: node scripts/createNewEthereumIdentity.js

      - name: Step 3 - Link Human to Agent
        # Mapping inputs to ENV variables prevents shell quoting issues
        env:
          AGENT_NAME: ${{ github.event.inputs.agent_name }}
          AGENT_DESC: ${{ github.event.inputs.agent_description }}
        run: |
          # Constructing the JSON string carefully within the shell
          CHALLENGE_JSON="{\"name\":\"$AGENT_NAME\",\"description\":\"$AGENT_DESC\"}"
          node scripts/manualLinkHumanToAgent.js --challenge "$CHALLENGE_JSON"

